    <text x="732" y="540" fill="#ffd600" font-size="20" font-weight="700">03</text>
    <text x="774" y="540" fill="#f5f5f0" font-size="25" font-weight="700">Confirmar</text>
    <text x="774" y="575" fill="#bdc5d1" font-size="18">Verificação manual</text>

    <path d="M1013 533H1053" fill="none" stroke="#ffd600" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1080" y="540" fill="#ffd600" font-size="20" font-weight="700">04</text>
    <text x="1122" y="540" fill="#f5f5f0" font-size="25" font-weight="700">Documentar</text>
    <text x="1122" y="575" fill="#bdc5d1" font-size="18">Evidências e limites</text>
  </g>
</svg>
