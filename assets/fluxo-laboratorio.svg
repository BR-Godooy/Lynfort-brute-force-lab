<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Ambiente e método do Brute Force Lab</title>
  <desc id="desc">Kali Linux, endereço 192.168.56.102, envia os testes ao Metasploitable 2, endereço 192.168.56.103, nos serviços FTP, DVWA e SMB. Os resultados são confirmados manualmente. A captura de rede documenta apenas o adaptador do Kali em host-only. Método: reconhecer, testar, confirmar e documentar.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#ffd600" stroke-width="2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="20" fill="#151820"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="59" fill="#ffd600" font-size="16" font-weight="700" letter-spacing="3">LYNFORT / AMBIENTE E MÉTODO</text>
    <text x="56" y="111" fill="#f5f5f0" font-size="34" font-weight="700">Do reconhecimento à confirmação</text>
    <path d="M56 138H1384" fill="none" stroke="#39414e" stroke-width="1.5"/>

    <rect x="56" y="179" width="300" height="183" rx="12" fill="#202530" stroke="#49505e" stroke-width="1.5"/>
    <path d="M82 206H108M82 213H100" stroke="#ffd600" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="252" fill="#f5f5f0" font-size="29" font-weight="700">Kali Linux</text>
    <text x="82" y="287" fill="#bdc5d1" font-size="22">192.168.56.102</text>
    <text x="82" y="331" fill="#ffd600" font-size="18">Enumeração + Medusa</text>

    <path d="M366 272H421" fill="none" stroke="#ffd600" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="436" y="165" width="553" height="211" rx="12" fill="#202530" stroke="#49505e" stroke-width="1.5"/>
    <text x="464" y="207" fill="#f5f5f0" font-size="29" font-weight="700">Metasploitable 2</text>
    <text x="464" y="241" fill="#bdc5d1" font-size="22">192.168.56.103</text>
    <path d="M464 265H961M622 282V348M799 282V348" fill="none" stroke="#49505e" stroke-width="1.5"/>
    <text x="464" y="304" fill="#ffd600" font-size="22" font-weight="700">FTP</text>
    <text x="464" y="338" fill="#bdc5d1" font-size="19">21 / TCP</text>
    <text x="649" y="304" fill="#ffd600" font-size="22" font-weight="700">DVWA</text>
    <text x="649" y="338" fill="#bdc5d1" font-size="19">80 / TCP · Low</text>
    <text x="826" y="304" fill="#ffd600" font-size="22" font-weight="700">SMB</text>
    <text x="826" y="338" fill="#bdc5d1" font-size="19">139 / 445 TCP</text>

    <path d="M1000 272H1056" fill="none" stroke="#ffd600" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1072" y="179" width="312" height="183" rx="12" fill="#202530" stroke="#49505e" stroke-width="1.5"/>
    <path d="M1100 207L1107 214L1120 200" fill="none" stroke="#ffd600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1100" y="252" fill="#f5f5f0" font-size="27" font-weight="700">Confirmação manual</text>
    <text x="1100" y="287" fill="#bdc5d1" font-size="21">FTP · formulário · SMB</text>
    <text x="1100" y="331" fill="#ffd600" font-size="18">Resultado + evidência</text>

    <circle cx="62" cy="412" r="5" fill="#ffd600"/>
    <text x="80" y="419" fill="#bdc5d1" font-size="20">Rede virtual: adaptador do Kali documentado em host-only.</text>

    <path d="M56 452H1384" fill="none" stroke="#39414e" stroke-width="1.5"/>
    <text x="56" y="490" fill="#bdc5d1" font-size="15" font-weight="700" letter-spacing="2">MÉTODO DO LABORATÓRIO</text>

    <text x="56" y="540" fill="#ffd600" font-size="20" font-weight="700">01</text>
    <text x="98" y="540" fill="#f5f5f0" font-size="25" font-weight="700">Reconhecer</text>
    <text x="98" y="575" fill="#bdc5d1" font-size="18">Serviços e usuários</text>

    <path d="M338 533H378" fill="none" stroke="#ffd600" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="404" y="540" fill="#ffd600" font-size="20" font-weight="700">02</text>
    <text x="446" y="540" fill="#f5f5f0" font-size="25" font-weight="700">Testar</text>
    <text x="446" y="575" fill="#bdc5d1" font-size="18">Listas pequenas</text>

